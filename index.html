<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>KineticLab</title>
  <style>
    body {
      margin: 0;
      background: #111;
    }
    canvas {
      display: block;
      margin: auto;
      background: #222;
    }
  </style>
</head>
<body>

<!-- Recipe Panel -->
<div id="recipePanel" style="
    position: fixed; 
    top: 10px; 
    right: 10px; 
    background: rgba(0,0,0,0.6); 
    color: white; 
    padding: 8px; 
    border-radius: 5px;
    font-family: sans-serif;
">
  <strong>Discovered Recipes:</strong>
  <ul id="recipeList" style="margin:0; padding-left:20px;"></ul>
</div>

<!-- Money Display -->
<div id="moneyDisplay" style="
    position: fixed;
    top: 10px;
    left: 10px;
    background: rgba(0,0,0,0.6);
    color: white;
    padding: 6px 10px;
    border-radius: 5px;
    font-family: sans-serif;
">
  Money: $<span id="moneyAmount">0</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
<script src="main.js"></script>
<script src="modLoader.js"></script>
</body>
</html>
